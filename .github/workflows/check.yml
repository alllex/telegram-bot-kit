name: Check

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

concurrency:
  group: "${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: true

jobs:
  ready-for-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Bootstrap JVM for Gradle itself, deliberately independent of both the
      # build's toolchain (jvmToolchain 21, provisioned by the foojay resolver)
      # and the bytecode release target (jdkTarget 17). It only needs to be new
      # enough to run Gradle, so it does not need to track either of them.
      - uses: actions/setup-java@v4
        with:
          java-version-file: .github/workflows/.ci-java-version
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Check with Gradle
        run: ./gradlew check
