name: Check

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

concurrency:
  group: "${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: true

jobs:
  ready-for-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Bootstrap JVM for Gradle itself, deliberately independent of both the
      # build's toolchain (jvmToolchain 21, provisioned by the foojay resolver)
      # and the bytecode release target (jdkTarget 17). It only needs to be new
      # enough to run Gradle, so it does not need to track either of them.
      - uses: actions/setup-java@v4
        with:
          java-version-file: .github/workflows/.ci-java-version
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Check with Gradle
        run: ./gradlew check

      # Guard against generated output drifting from the committed sources.
      # Generation is deterministic given the committed spec, so a dirty tree
      # here means the toolchain changed what it produces (as a jsoup upgrade
      # once did, silently dropping emoji) or that someone edited generated
      # files by hand. Either way the fix is to regenerate and commit.
      - name: Verify generated sources are up to date
        run: |
          ./gradlew extractBotApi generateBotApi
          if [ -n "$(git status --porcelain api-spec src/main/generated-kotlin)" ]; then
            echo "Generated output differs from committed sources:"
            git --no-pager diff --stat api-spec src/main/generated-kotlin
            echo "Run './gradlew extractBotApi generateBotApi' and commit the result."
            exit 1
          fi
