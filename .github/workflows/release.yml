name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: "release"
  cancel-in-progress: false

jobs:
  release-to-maven-central:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Bootstrap JVM for Gradle itself, deliberately independent of both the
      # build's toolchain (jvmToolchain 21, provisioned by the foojay resolver)
      # and the bytecode release target (jdkTarget 17). It only needs to be new
      # enough to run Gradle, so it does not need to track either of them.
      - uses: actions/setup-java@v4
        with:
          java-version-file: .github/workflows/.ci-java-version
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Publish artifacts
        run: ./gradlew :publishToSonatype :closeAndReleaseSonatypeStagingRepository --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_signingKeyId: ${{secrets.SIGNING_KEY_ID}}
          ORG_GRADLE_PROJECT_signingKey: ${{secrets.SIGNING_KEY}}
          ORG_GRADLE_PROJECT_signingPassword: ${{secrets.SIGNING_PASSWORD}}
          ORG_GRADLE_PROJECT_sonatypeUsername: ${{secrets.SONATYPE_USERNAME}}
          ORG_GRADLE_PROJECT_sonatypePassword: ${{secrets.SONATYPE_PASSWORD}}
